name: ipatool-rs CI

on:
  workflow_dispatch:
  push:
    paths:
      - "**.rs"
      - "**.toml"
      - "**.yml"

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build
        run: |
          cargo build --release
